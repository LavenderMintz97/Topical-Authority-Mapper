            var originalFetch = window.fetch ? window.fetch.bind(window) : null;
            var currentFetch = originalFetch;

            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch || (originalFetch ? originalFetch : window.fetch);
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            try {
              var originalFetchProto = Window.prototype.fetch;
              var currentFetchProto = originalFetchProto;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetchProto;
                },

                },

              });
            } catch (e2) {}
